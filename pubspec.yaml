name: sports_store
description: "Ứng dụng cửa hàng thể thao trực tuyến."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.0.2
  supabase_flutter: 2.18.0
  http: 1.6.0
  flutter_secure_storage: 11.2.0
  uuid: 4.6.0
  flutter_map: 8.3.2
  latlong2: 0.9.1
  url_launcher: 6.3.3
  path_provider: 2.1.6
  file_selector: 1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/BarlowCondensed-OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
